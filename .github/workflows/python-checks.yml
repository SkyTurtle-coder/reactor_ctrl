name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install dependencies and check compatibility
        run: |
          python -m pip install -r requirements.txt pytest pip-audit
          python -m pip check
      - name: Check Gunicorn startup configuration
        env:
          AUTO_CREATE_SCHEMA: 'false'
          DEVICE_MANUAL_RECONCILER_ENABLED: 'false'
          RECIPE_PROGRAM_RECONCILER_ENABLED: 'false'
        run: |
          DATABASE_URL="sqlite:///$RUNNER_TEMP/reactor-ctrl-check.db" \
            gunicorn --check-config --config gunicorn.conf.py app:app
      - name: Run tests
        run: python -m pytest -q
      - name: Audit Python dependencies
        run: python -m pip_audit --strict -r requirements.txt
